<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flappy Bird</title>
    <style>
        body { margin: 0; background: #70c5ce; }
        canvas { display: block; margin: 0 auto; background: #70c5ce; }
        
    </style>
</head>
<body>
    <canvas id="canvas" width="320" height="480"></canvas>
    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        
        // Game Variables
        let bird = { x: 50, y: 150, width: 20, height: 20, gravity: 0.6, lift: -15, velocity: 0 };
        let pipes = []; 
        let score = 0;
        let gameFrame = 0;
        const pipeWidth = 50;
        const pipeGap = 100;
        const pipeFrequency = 75; // frames between pipe spawns

        function drawBird() {
            ctx.fillStyle = 'yellow';
            ctx.fillRect(bird.x, bird.y, bird.width, bird.height);
        }

        function drawPipes() {
            ctx.fillStyle = 'green';
            pipes.forEach(pipe => {
                ctx.fillRect(pipe.x, 0, pipeWidth, pipe.top);
                ctx.fillRect(pipe.x, canvas.height - pipe.bottom, pipeWidth, pipe.bottom);
            });
        }

        function updatePipes() {
            if (gameFrame % pipeFrequency === 0) {
                let top = Math.random() * (canvas.height - pipeGap - 40) + 20;
                let bottom = canvas.height - top - pipeGap;
                pipes.push({ x: canvas.width, top, bottom });
            }
            pipes.forEach((pipe, index) => {
                pipe.x -= 2;
                // Check for collisions
                if (pipe.x < bird.x + bird.width && pipe.x + pipeWidth > bird.x) {
                    if (bird.y < pipe.top || bird.y + bird.height > canvas.height - pipe.bottom) {
                        // Collision detected
                        alert('Game Over!');
                        document.location.reload();
                    }
                }
                // Increment score
                if (pipe.x + pipeWidth < bird.x && !pipe.scored) {
                    score++;
                    pipe.scored = true;
                }
                // Remove pipes that are offscreen
                if (pipe.x + pipeWidth < 0) {
                    pipes.splice(index, 1);
                }
            });
        }

        function updateBird() {
            bird.velocity += bird.gravity;
            bird.y += bird.velocity;
            if (bird.y + bird.height >= canvas.height) {
                bird.y = canvas.height - bird.height;
            }
        }

        function flap() {
            bird.velocity = bird.lift;
        }

        // Event listeners
        document.addEventListener('keydown', flap);

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            drawBird();
            drawPipes();
            updateBird();
            updatePipes();
            ctx.fillStyle = 'black';
            ctx.font = '16px Arial';
            ctx.fillText('Score: ' + score, 10, 20);
            gameFrame++;
            requestAnimationFrame(draw);
        }

        draw();
    </script>
</body>
</html>
